# Site settings
title: "EthervoxAI"
description: "Intelligent tools that leverage the modern processing power you already own - Privacy-First AI for Everyone"
url: "https://ethervox.ai"
baseurl: ""

# Build settings
markdown: kramdown
theme: null
plugins:
  - jekyll-seo-tag

# Navigation
navigation:
  - title: Home
    url: /
  - title: About
    url: /about
  - title: Products
    url: /products
  - title: Legal
    url: /legal

# Social links (placeholders)
social:
  github: "https://github.com/ethervox-ai"
  
# Exclude from processing
exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - SECURITY.md
  - profile/
  - .git/
  - .gitignore
  - Gemfile
  - Gemfile.lock
